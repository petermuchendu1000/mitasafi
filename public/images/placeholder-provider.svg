<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0D9488" stroke-width="0.5" stroke-opacity="0.08"/>
  </pattern>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- Person silhouette (gender-neutral) -->
  <g transform="translate(400,260)" fill="url(#icon)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="48"/>
    <!-- Body -->
    <path d="M-72,40 Q-72,-10 -50,-25 Q-25,-35 0,-35 Q25,-35 50,-25 Q72,-10 72,40 Q72,75 70,95 L-70,95 Q-72,75 -72,40Z"/>
  </g>
  <!-- "Service Provider" text -->
  <text x="400" y="410" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="500" fill="#0D9488" fill-opacity="0.5">Service Provider</text>
</svg>
