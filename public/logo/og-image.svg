<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- MitaSafi Open Graph / Social Share Image -->
  <rect width="1200" height="630" fill="#0D9488"/>
  
  <!-- Subtle pattern overlay -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Centered Logo Icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" transform="translate(420, 140)">
    <!-- M shape with integrated house -->
    <path d="M15 160 L15 75 L60 30"/>
    <path d="M60 30 L105 70"/>
    <path d="M105 70 L150 30"/>
    <path d="M150 30 L195 75 L195 160"/>
    <path d="M15 160 L195 160"/>
    <!-- House roof inside -->
    <path d="M65 110 L105 70 L145 110"/>
    <!-- House walls -->
    <path d="M75 110 L75 145 L135 145 L135 110"/>
    <!-- Door -->
    <path d="M97 145 L97 125 L113 125 L113 145"/>
  </g>
  
  <!-- Wordmark -->
  <text x="630" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    MitaSafi
  </text>
  
  <!-- Tagline -->
  <text x="630" y="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.9)" text-anchor="middle">
    Modern Rental Management for Nairobi
  </text>
</svg>
