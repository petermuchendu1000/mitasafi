app = "mitasafi-web"
primary_region = "jnb"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Scale to zero while nobody is looking. The site has no traffic yet, so a
  # machine idling 24/7 would be paid for nothing; the cost is a cold start of
  # a few seconds on the first request after an idle period.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
